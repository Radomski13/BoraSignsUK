[build]
  publish = "site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Old Shopify URLs -> new pages (keeps ads and Google links working)
[[redirects]]
  from = "/collections/*"
  to = "/products/magnetic-van-signs/"
  status = 301
[[redirects]]
  from = "/cart"
  to = "/checkout/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/checkout/*"
  [headers.values]
    Cache-Control = "no-store"
